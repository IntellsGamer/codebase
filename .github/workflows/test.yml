name: Proxy Tester

on:
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write  # Grant write permissions to the repository

jobs:
  test-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create test script
        run: |
          cat > test_proxies.py << 'EOF'
          #!/usr/bin/env python3
          import re
          import socket
          import requests
          import time
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          import urllib.parse
          import sys
          import os
          import glob

          def find_proxy_file():
              """Find the proxy list file (list.txt or socks5*.txt)"""
              # Check for list.txt first
              if os.path.exists('list.txt'):
                  return 'list.txt'
              
              # Check for socks5*.txt files
              sock_files = glob.glob('socks5*.txt')
              if sock_files:
                  return sock_files[0]
              
              return None

          def parse_proxy(proxy_string):
              """Parse various proxy formats and return standardized URL"""
              proxy_string = proxy_string.strip()
              
              # Skip empty lines and comments
              if not proxy_string or proxy_string.startswith('#'):
                  return None
              
              # Check if already has protocol
              if not proxy_string.startswith(('socks5://', 'socks://', 'http://', 'https://')):
                  # Try socks5 first (most common)
                  try:
                      # Test if it's a valid IP:PORT
                      parts = proxy_string.split(':')
                      if len(parts) == 2:
                          ip, port = parts
                          socket.inet_aton(ip)  # Validate IP
                          return f"socks5://{proxy_string}"
                  except:
                      pass
                  return None
              return proxy_string

          def test_proxy(proxy_str):
              """Test a single proxy for connectivity, latency, and speed"""
              try:
                  proxy_str = parse_proxy(proxy_str)
                  if not proxy_str:
                      return None
                  
                  # Parse proxy URL
                  parsed = urllib.parse.urlparse(proxy_str)
                  protocol = parsed.scheme
                  host = parsed.hostname
                  port = parsed.port
                  
                  if not host or not port:
                      return None
                  
                  proxies = {
                      'http': proxy_str,
                      'https': proxy_str,
                  }
                  
                  # Test latency with socket connection
                  start_time = time.time()
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(3)
                  try:
                      sock.connect((host, port))
                      latency = (time.time() - start_time) * 1000  # Convert to ms
                      sock.close()
                  except:
                      return None
                  
                  # Test speed and functionality with HTTP request
                  test_urls = [
                      'http://httpbin.org/ip',
                      'http://ip-api.com/json',
                      'http://ipinfo.io/ip'
                  ]
                  
                  speed_test_url = 'http://speedtest.tele2.net/1MB.zip'
                  
                  # First, test if proxy works for HTTP requests
                  working = False
                  for url in test_urls[:2]:  # Try first 2 test URLs
                      try:
                          response = requests.get(url, proxies=proxies, timeout=5)
                          if response.status_code == 200:
                              working = True
                              break
                      except:
                          continue
                  
                  if not working:
                      return None
                  
                  # Test speed by downloading a small file
                  try:
                      start_time = time.time()
                      response = requests.get(speed_test_url, proxies=proxies, timeout=10, stream=True)
                      if response.status_code == 200:
                          content_length = 0
                          for chunk in response.iter_content(chunk_size=1024):
                              content_length += len(chunk)
                              if time.time() - start_time > 3:  # Limit to 3 seconds
                                  break
                          
                          elapsed = time.time() - start_time
                          if elapsed > 0 and content_length > 0:
                              speed_mbps = (content_length * 8) / (elapsed * 1024 * 1024)
                          else:
                              speed_mbps = 0
                      else:
                          speed_mbps = 0
                  except:
                      speed_mbps = 0
                  
                  # Get location information using IP API
                  location = "Unknown"
                  try:
                      response = requests.get('http://ip-api.com/json/', proxies=proxies, timeout=5)
                      if response.status_code == 200:
                          data = response.json()
                          if data.get('status') == 'success':
                              location = f"{data.get('city', 'Unknown')}, {data.get('countryCode', 'Unknown')}"
                  except:
                      pass
                  
                  return {
                      'proxy': proxy_str,
                      'latency': round(latency, 2),
                      'speed': round(speed_mbps, 2),
                      'location': location
                  }
                  
              except Exception as e:
                  return None

          def main():
              # Find the proxy file
              proxy_file = find_proxy_file()
              if not proxy_file:
                  print("Error: No proxy file found (list.txt or socks5*.txt)")
                  print("Please create list.txt with your proxies")
                  sys.exit(1)
              
              print(f"Using proxy file: {proxy_file}")
              
              # Read proxies from file
              try:
                  with open(proxy_file, 'r') as f:
                      proxies = [line.strip() for line in f if line.strip()]
              except FileNotFoundError:
                  print(f"Error: {proxy_file} not found")
                  sys.exit(1)
              
              if not proxies:
                  print("No proxies found in file")
                  sys.exit(1)
              
              print(f"Testing {len(proxies)} proxies...")
              print("-" * 60)
              
              # Test proxies in parallel
              results = []
              with ThreadPoolExecutor(max_workers=20) as executor:
                  future_to_proxy = {executor.submit(test_proxy, proxy): proxy for proxy in proxies}
                  completed = 0
                  for future in as_completed(future_to_proxy):
                      completed += 1
                      result = future.result()
                      if result:
                          results.append(result)
                          print(f"✓ {result['proxy']} - {result['location']} - {result['latency']}ms - {result['speed']}MB/s")
                      else:
                          print(f"✗ {future_to_proxy[future]} - Failed")
                      
                      # Show progress
                      if completed % 10 == 0:
                          print(f"Progress: {completed}/{len(proxies)}")
              
              # Sort by speed (highest first) then by latency (lowest first)
              results.sort(key=lambda x: (-x['speed'], x['latency']))
              
              # Generate output filename with date-time
              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              output_file = f"output-{timestamp}.txt"
              
              # Write results
              with open(output_file, 'w') as f:
                  for result in results:
                      f.write(f"{result['proxy']}#{result['location']} {result['latency']}ms {result['speed']}MB/s\n")
              
              print("-" * 60)
              print(f"✓ Results written to {output_file}")
              print(f"✓ Found {len(results)} working proxies out of {len(proxies)}")
              
              # Print top 5 proxies
              if results:
                  print("\n🏆 Top 5 Proxies:")
                  for i, result in enumerate(results[:5], 1):
                      print(f"{i}. {result['proxy']} - {result['location']} - {result['latency']}ms - {result['speed']}MB/s")

          if __name__ == "__main__":
              main()
          EOF
          chmod +x test_proxies.py
          
      - name: Install Python dependencies
        run: |
          pip install requests
          
      - name: Check for proxy file
        run: |
          if [ ! -f list.txt ] && [ ! -f socks5*.txt ]; then
            echo "No proxy file found. Creating sample list.txt..."
            cat > list.txt << 'EOF'
          socks5://208.102.51.6:58208
          69.61.200.104:36181
          socks://66.42.224.229:41679
          EOF
          fi
          
      - name: Test proxies
        run: python3 test_proxies.py
        
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: proxy-results
          path: output-*.txt
          
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output-*.txt || echo "No output files to add"
          git commit -m "Add proxy test results $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push failed - check permissions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
